# Shared Kueue config for the demo gallery hub (Kueue ≥ 0.19).
# Unions frameworks needed by kueue-admission / grove / openshift-workload-api
# with DRA deviceClassMappings for kueue-dra.
# Chart path: top-level managerConfig.controllerManagerConfigYaml
managerConfig:
  controllerManagerConfigYaml: |
    apiVersion: config.kueue.x-k8s.io/v1beta2
    kind: Configuration
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: :8443
    webhook:
      port: 9443
    leaderElection:
      leaderElect: true
      resourceName: c1f6bfd2.kueue.x-k8s.io
    integrations:
      frameworks:
        - batch/job
        - ray.io/rayjob
        - ray.io/raycluster
    manageJobsWithoutQueueName: false
    resources:
      deviceClassMappings:
        - name: example.com/gpu
          deviceClassNames:
            - gpu.example.com
