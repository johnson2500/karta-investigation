apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "karta-demo-hub.fullname" . }}
  labels:
    {{- include "karta-demo-hub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "karta-demo-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "karta-demo-hub.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "karta-demo-hub.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gallery
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: CATALOG_PATH
              value: /app/data/catalog.json
            - name: CONTENT_ROOT
              value: /app/content
            - name: ENABLED_DEMOS_PATH
              value: /app/config/enabled.json
          volumeMounts:
            - name: enabled
              mountPath: /app/config
              readOnly: true
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: enabled
          configMap:
            name: {{ include "karta-demo-hub.fullname" . }}-catalog
