{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "karta-demo-hub.fullname" . }}-status
  labels:
    {{- include "karta-demo-hub.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "karta-demo-hub.fullname" . }}-status
  labels:
    {{- include "karta-demo-hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "karta-demo-hub.fullname" . }}-status
subjects:
  - kind: ServiceAccount
    name: {{ include "karta-demo-hub.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
