{{- if .Values.grove.enabled }}
# Grove clique topology on default-scheduler — no KAI / Volcano profile.
# Grove owns application shape; kube-scheduler Workload API owns gang placement.
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: {{ .Values.grove.podCliqueSet.name }}
  labels:
    {{- include "karta-openshift-workload-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.grove.podCliqueSet.replicas }}
  template:
    cliques:
      - name: {{ .Values.grove.podCliqueSet.cliqueName }}
        spec:
          roleName: {{ .Values.grove.podCliqueSet.cliqueName }}
          replicas: {{ .Values.grove.podCliqueSet.cliqueReplicas }}
          podSpec:
            # Explicit: OpenShift / kube default scheduler — never KAI.
            schedulerName: default-scheduler
            containers:
              - name: {{ .Values.grove.podCliqueSet.cliqueName }}
                image: {{ .Values.grove.podCliqueSet.image | quote }}
                command:
                  {{- toYaml .Values.grove.podCliqueSet.command | nindent 18 }}
                resources:
                  {{- toYaml .Values.grove.podCliqueSet.resources | nindent 18 }}
{{- end }}
