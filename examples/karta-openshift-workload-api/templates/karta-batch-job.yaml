{{- if and .Values.karta.enabled .Values.karta.batchJob.enabled }}
# =============================================================================
# Karta map for batch/v1 Job — OpenShift AI / Workload API demo
# =============================================================================
# Schema translation only. Admission is Kueue; placement is kube-scheduler +
# OpenShift Workload API (not KAI). Same batch/v1 API OpenShift uses for batch.
#
# One map covers every Job kind in this chart — including gang-training-job.
# =============================================================================
apiVersion: run.ai/v1alpha1
kind: Karta
metadata:
  name: {{ .Values.karta.batchJob.name }}
  labels:
    {{- include "karta-openshift-workload-api.labels" . | nindent 4 }}
spec:
  structureDefinition:
    rootComponent:
      name: job
      kind:
        group: batch
        version: v1
        kind: Job
      # Pod template path — platforms discover containers / resources without Go.
      specDefinition:
        podTemplateSpecPath: .spec.template
      scaleDefinition:
        replicasPath: .spec.parallelism // 1
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        # Portable phases shared with other Karta maps in this repo.
        statusMappings:
          initializing:
            - byExpression:
                expression: (.status.active // 0) > 0 and (.status.ready // 0) == 0
                expectedResult: "true"
          running:
            - byExpression:
                expression: (.status.active // 0) > 0 and (.status.ready // 0) > 0
                expectedResult: "true"
          completed:
            - byConditions:
                - type: Complete
                  status: "True"
            - byConditions:
                - type: SuccessCriteriaMet
                  status: "True"
          failed:
            - byConditions:
                - type: Failed
                  status: "True"
            - byConditions:
                - type: FailureTarget
                  status: "True"
          degraded:
            - byExpression:
                expression: .spec.parallelism > 1 and (.status.ready // 0) < .spec.parallelism and ((.status.succeeded // 0) > 0 or (.status.failed // 0) > 0)
                expectedResult: "true"
          suspended:
            - byConditions:
                - type: Suspended
                  status: "True"
      # Same suspend field Kueue uses when holding Jobs under quota.
      suspendDefinition:
        suspendActions:
          - path: .spec.suspend
            value: "true"
        resumeActions:
          - path: .spec.suspend
            value: "false"
  # Gang hint for Job pods — Workload API / KEP-6012 consumers, not KAI PodGroups.
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: job
          members:
            - componentName: job
              groupByKeyPaths:
                - .metadata.labels["batch.kubernetes.io/job-name"]
{{- end }}
